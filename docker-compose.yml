services:
  postgres:
    image: postgres:18-alpine
    container_name: cafemenu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cafemenu}
      POSTGRES_USER: ${POSTGRES_USER:-cafemenu_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      -